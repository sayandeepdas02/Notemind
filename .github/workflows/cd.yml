name: CD — Build & Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com
  KUBE_CLUSTER: notemind-production

jobs:
  build-and-push:
    name: Build Docker Images & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/notemind-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/notemind-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/notemind-api:latest

      - name: Build & push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/notemind-worker:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/notemind-worker:latest

  deploy:
    name: Deploy to Kubernetes (Blue/Green)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/notemind-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.KUBE_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Update image tags in manifests
        run: |
          sed -i 's|<ECR_REGISTRY>/notemind-api:latest|${{ env.ECR_REGISTRY }}/notemind-api:${{ github.sha }}|g' infra/k8s/api-deployment.yaml
          sed -i 's|<ECR_REGISTRY>/notemind-worker:latest|${{ env.ECR_REGISTRY }}/notemind-worker:${{ github.sha }}|g' infra/k8s/worker-deployment.yaml

      - name: Apply K8s manifests
        run: |
          kubectl apply -f infra/k8s/
          kubectl rollout status deployment/notemind-api -n production --timeout=300s
          kubectl rollout status deployment/notemind-worker -n production --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl get pods -n production -l app=notemind-api
          kubectl get pods -n production -l app=notemind-worker

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/notemind-api -n production
          kubectl rollout undo deployment/notemind-worker -n production
