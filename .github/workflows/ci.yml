name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend (Go) — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: notemind
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: notemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Tidy modules
        run: go mod tidy
        working-directory: backend

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2
          args: ./...

      - name: Run tests
        env:
          DATABASE_DSN: postgres://notemind:testpassword@localhost:5432/notemind_test?sslmode=disable
          REDIS_ADDR: localhost:6379
          APP_ENV: test
        run: go test -race -coverprofile=coverage.out ./...
        working-directory: backend

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out

  frontend-lint-build:
    name: Frontend (Next.js) — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.notemind.app
