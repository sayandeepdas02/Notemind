apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notemind-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300" # Long timeout for SSE streams
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.notemind.app
      secretName: notemind-tls
  rules:
    - host: api.notemind.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notemind-api-service
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: notemind-api-service
  namespace: production
spec:
  selector:
    app: notemind-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
